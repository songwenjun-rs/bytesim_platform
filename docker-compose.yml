# Local-dev fullstack — pulls each submodule's docker-compose.yml via
# `include:` so this file only owns the things specific to running
# everything on one machine:
#   - dev-mode shortcuts for bff (skip the strong-secret + CORS gates)
#   - `web`: Vite hot-reload SPA at :5173. Production-shape SPA is
#     dashboard/docker-compose.yml (nginx + baked dist/).
#
# For cross-host deploy, run each submodule's compose on its own host —
# see README → "跨机部署".

include:
  - service/data_svc/docker-compose.postgres.yml
  - service/data_svc/docker-compose.yml
  - service/tco_svc/docker-compose.yml
  - service/surrogate_svc/docker-compose.yml
  - service/bytesim_svc/docker-compose.yml
  - service/engine_svc/docker-compose.yml
  - bff/docker-compose.yml

services:
  bff:
    environment:
      - BFF_ALLOW_DEV_SECRET=1
      - BFF_ALLOW_DEV_CORS=1

  web:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_BFF_URL: "http://bff:8080"
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
    command: sh -c "npm install --no-fund --no-audit && npm run dev -- --host 0.0.0.0"

# Preserve the pre-include volume name (bytesim_platform_pgdata) so
# users with existing dev data don't lose access on this refactor. The
# included data_svc/docker-compose.postgres.yml declares `bytesim_pgdata`
# project-scoped; the `name:` override pins it to the absolute name.
volumes:
  bytesim_pgdata:
    name: bytesim_platform_pgdata
