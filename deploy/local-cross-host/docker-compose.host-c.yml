# Host C — data tier only (data_svc).
# Postgres has been split into its own standalone compose
# (docker-compose.postgres.yml). data_svc now talks to PG the same way
# every other "host" does: via host.docker.internal:15432.

networks:
  host-c-net:
    driver: bridge

services:
  data_svc:
    build:
      context: ../../service/data_svc
    image: cross-host-data-svc:dev
    container_name: cross-host-data-svc
    restart: unless-stopped
    networks: [host-c-net]
    env_file: ./env/host-c.env
    ports:
      - "18081:8081"        # exposed to other "hosts"
    # Healthcheck inherited from the Dockerfile (uses /healthcheck binary
    # at image root — this is a distroless image with no shell or PATH).
