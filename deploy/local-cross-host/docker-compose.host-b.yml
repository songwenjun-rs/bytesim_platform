# Host B — BFF gateway
# Sits between nginx (host A) and the backend tiers (hosts C, D).
# Receives /v1/* + WS over published port 18080; fans out to host C / D
# using their host-exposed ports.

networks:
  host-b-net:
    driver: bridge

services:
  bff:
    build:
      context: ../../bff
    image: cross-host-bff:dev
    container_name: cross-host-bff
    restart: unless-stopped
    networks: [host-b-net]
    env_file: ./env/host-b.env
    ports:
      - "18080:8080"
