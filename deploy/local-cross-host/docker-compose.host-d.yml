# Host D — engines + orchestrator + (merged) registry + TCO
# bytesim_svc is OMITTED because its build requires external engine assets
# (engine/bytesim/synverse/src etc.) not present in this dev environment.
# Add it back if/when those assets are populated.
#
# surrogate_svc default port 8083 is exposed as 18083 on the host.
# engine_svc default port 8087 is exposed as 18087 on the host — it serves
# BOTH the pipeline orchestrator and the registry surface after the merge,
# so /v1/engines and /v1/predict now go to :18087 (was :18089 in the
# pre-merge stack).

networks:
  host-d-net:
    driver: bridge

services:
  surrogate_svc:
    build:
      context: ../../service/surrogate_svc
    image: cross-host-surrogate-svc:dev
    container_name: cross-host-surrogate-svc
    restart: unless-stopped
    networks: [host-d-net]
    env_file: ./env/host-d.env
    environment:
      # Registry surface lives in engine_svc now — same env name, new port.
      ENGINE_REGISTRY_URL: http://host.docker.internal:18087
      ASSET_SVC_URL:       http://host.docker.internal:18081
      # critical: the URL engine_svc uses to reach this engine when routing
      # /v1/predict. Must point back at the host-exposed port (18083), not
      # the in-container 8083 (engine_svc isn't on this bridge).
      ENGINE_SELF_URL:     http://host.docker.internal:18083
    ports:
      - "18083:8083"

  tco_svc:
    build:
      context: ../../service/tco_svc
    image: cross-host-tco-svc:dev
    container_name: cross-host-tco-svc
    restart: unless-stopped
    networks: [host-d-net]
    env_file: ./env/host-d.env
    environment:
      # Phase 1 consolidation: tco_svc no longer connects to PG.
      # It now reaches the tco_rule / tco_breakdown tables via data_svc.
      RUN_SVC_URL: http://host.docker.internal:18081
    ports:
      - "18090:8090"

  engine_svc:
    build:
      context: ../../service/engine_svc
    image: cross-host-engine-svc:dev
    container_name: cross-host-engine-svc
    restart: unless-stopped
    networks: [host-d-net]
    env_file: ./env/host-d.env
    environment:
      RUN_SVC_URL:         http://host.docker.internal:18081
      # Registry surface is co-hosted here; pipeline's predict client just
      # loops back to localhost inside the container.
      ENGINE_REGISTRY_URL: http://localhost:8087
      TCO_SVC_URL:         http://host.docker.internal:18090
    ports:
      - "18087:8087"
    depends_on:
      - tco_svc
